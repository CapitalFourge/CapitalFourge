name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"
  DOCKER_API_VERSION: "1.44"
  TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  # =========================================================================
  # BACKEND - Spring Boot (portfolio-manager)
  # =========================================================================
  backend-test:
    name: Backend Tests (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U test -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test (portfolio-manager)
        working-directory: ./portfolio-manager
        run: |
          mvn clean verify -DskipTests=false \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/testdb \
            -Dspring.datasource.username=test \
            -Dspring.datasource.password=test \
            -Dspring.redis.host=localhost \
            -Dspring.redis.port=6379

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: portfolio-manager/target/surefire-reports/

  # =========================================================================
  # BACKEND - Data Collector (Python FastAPI)
  # =========================================================================
  data-collector-test:
    name: Data Collector Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./data-collector
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock httpx

      - name: Run tests
        working-directory: ./data-collector
        run: |
          pytest -v --tb=short

  # =========================================================================
  # FRONTEND - Next.js
  # =========================================================================
  frontend-test:
    name: Frontend Tests (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run linting
        working-directory: ./frontend
        run: pnpm lint

      - name: Run type check
        working-directory: ./frontend
        run: pnpm type-check

      - name: Run unit tests
        working-directory: ./frontend
        run: pnpm test -- --passWithNoTests

      - name: Build Next.js app
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GRAPHQL_URL: ${{ secrets.NEXT_PUBLIC_GRAPHQL_URL }}
        run: pnpm build

  # =========================================================================
  # DOCKER BUILD - Multi-stage images
  # =========================================================================
  docker-build:
    name: Docker Build & Push
    needs: [backend-test, data-collector-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for portfolio-manager
        id: meta-pm
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/portfolio-manager
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push portfolio-manager
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./portfolio-manager/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-pm.outputs.tags }}
          labels: ${{ steps.meta-pm.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for data-collector
        id: meta-dc
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/data-collector
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push data-collector
        uses: docker/build-push-action@v5
        with:
          context: ./data-collector
          file: ./data-collector/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dc.outputs.tags }}
          labels: ${{ steps.meta-dc.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # DEPLOY - VPS (on merge to main)
  # =========================================================================
  deploy-vps:
    name: Deploy to VPS (Docker Compose)
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/ubuntu/repositorios/CapitalFourge
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            # Wait for health checks
            sleep 30
            # Verify services
            curl -f https://api.capitalfourge.com/actuator/health/readiness || exit 1
            echo "✅ Deployment successful"

  # =========================================================================
  # DEPLOY - Vercel (Frontend)
  # =========================================================================
  deploy-vercel:
    name: Deploy Frontend to Vercel
    needs: frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # =========================================================================
  # SECURITY SCANS
  # =========================================================================
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Java)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './portfolio-manager'
          format: 'sarif'
          output: 'trivy-java.sarif'

      - name: Run Trivy vulnerability scanner (Python)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './data-collector'
          format: 'sarif'
          output: 'trivy-python.sarif'

      - name: Run Trivy vulnerability scanner (Docker)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'ghcr.io/${{ github.repository }}/portfolio-manager:latest'
          format: 'sarif'
          output: 'trivy-docker.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: '*.sarif'