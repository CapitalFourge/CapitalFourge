name: Capital Fourge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Database
  DB_NAME: finsight_db
  DB_USER: user
  # Redis
  # JWT
  JWT_ISSUER: capital-fourge
  JWT_ACCESS_EXPIRATION_MS: 86400000
  JWT_REFRESH_EXPIRATION_MS: 604800000
  # Data Collector
  DATA_COLLECTOR_BASE_URL: http://localhost:8000
  # Frontend
  NEXT_PUBLIC_API_BASE_URL: http://localhost:10000
  # Docker
  DOCKER_API_VERSION: "1.44"
  TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # BACKEND - Spring Boot (Maven) with Testcontainers
  # ──────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: maven:3.9.6-eclipse-temurin-17
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      options: --user root

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U user -d finsight_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('portfolio-manager/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up fallback JWT_SECRET
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "JWT_SECRET not set in secrets, using test fallback"
            echo "JWT_SECRET=test-secret-key-for-unit-tests-only-32chars-minimum-length!!" >> $GITHUB_ENV
          fi

      - name: Build and test with Maven
        working-directory: ./portfolio-manager
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          mvn -B dependency:go-offline -q
          mvn -B clean test \
            -Dspring.profiles.active=test \
            -DDB_HOST=postgres \
            -DDB_PORT=5432 \
            -DDB_NAME=${{ env.DB_NAME }} \
            -DDB_USER=${{ env.DB_USER }} \
            -DDB_PASSWORD=${{ env.DB_PASSWORD }} \
            -DDB_SSLMODE=disable \
            -DSPRING_REDIS_URL=redis://redis:6379 \
            -DJWT_SECRET=${{ env.JWT_SECRET }} \
            -DJWT_ISSUER=${{ env.JWT_ISSUER }} \
            -DJWT_ACCESS_EXPIRATION_MS=${{ env.JWT_ACCESS_EXPIRATION_MS }} \
            -DJWT_REFRESH_EXPIRATION_MS=${{ env.JWT_REFRESH_EXPIRATION_MS }} \
            -DDATA_COLLECTOR_BASE_URL=${{ env.DATA_COLLECTOR_BASE_URL }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: portfolio-manager/target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────
  # BACKEND - Data Collector (Python FastAPI)
  # ──────────────────────────────────────────────────────────────────
  data-collector-test:
    name: Data Collector Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./data-collector
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock httpx

      - name: Run tests
        working-directory: ./data-collector
        run: |
          pytest -v --tb=short

  # ──────────────────────────────────────────────────────────────────
  # FRONTEND UNIT TESTS - Vitest
  # ──────────────────────────────────────────────────────────────────
  frontend-unit-test:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run linting
        working-directory: ./frontend
        run: npx eslint . --ext .ts,.tsx || true

      - name: Run type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: ./frontend
        run: pnpm vitest run --reporter=verbose

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ──────────────────────────────────────────────────────────────────
  # FRONTEND BUILD CHECK
  # ──────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: pnpm build

  # ──────────────────────────────────────────────────────────────────
  # FRONTEND E2E TESTS - Playwright (Full stack integration)
  # ──────────────────────────────────────────────────────────────────
  frontend-e2e-test:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U user -d finsight_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('portfolio-manager/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: pnpm build

      # Start data-collector mock (port 8000)
      - name: Start data-collector mock
        run: |
          docker build -t data-collector-mock .github/scripts
          docker run -d --name data-collector-mock \
            -p 8000:8000 \
            data-collector-mock
          echo "Waiting for data-collector-mock to be ready..."
          for i in {1..5}; do
            RESPONSE=$(curl -sf http://localhost:8000/health 2>/dev/null || echo "")
            echo "Attempt $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"status"[[:space:]]*:[[:space:]]*"alive"'; then
              echo "Data collector mock ready"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "ERROR: Data collector mock failed to start"
              docker logs data-collector-mock
              exit 1
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | grep -q '"status"[[:space:]]*:[[:space:]]*"alive"' && echo "Mock verified alive" || (echo "Mock died after verification" && exit 1)

      - name: Start backend (Spring Boot)
        working-directory: ./portfolio-manager
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ ${#JWT_SECRET} -lt 32 ]; then
            echo "JWT_SECRET too short, using test fallback"
            JWT_SECRET="test-secret-key-for-unit-tests-only-32chars!!"
          fi
          mvn spring-boot:run \
            -Dspring-boot.run.jvmArguments="-Xms64m -Xmx512m -XX:MaxRAMPercentage=80.0 -XX:+UseZGC -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m" \
            -DDB_HOST=localhost \
            -DDB_PORT=5433 \
            -DDB_NAME=finsight_db \
            -DDB_USER=user \
            -DDB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -DDB_SSLMODE=disable \
            -DSPRING_REDIS_URL=redis://localhost:6379 \
            -DJWT_SECRET=${JWT_SECRET} \
            -DJWT_ISSUER=${{ env.JWT_ISSUER }} \
            -DJWT_ACCESS_EXPIRATION_MS=${{ env.JWT_ACCESS_EXPIRATION_MS }} \
            -DJWT_REFRESH_EXPIRATION_MS=${{ env.JWT_REFRESH_EXPIRATION_MS }} \
            -DDATA_COLLECTOR_BASE_URL=http://localhost:8000 \
            -Dserver.port=10000 \
            > backend.log 2>&1 &
          echo $! > backend.pid

      # Wait for backend to be ready - readiness probe
      - name: Wait for backend readiness
        working-directory: ./portfolio-manager
        run: |
          for i in {1..120}; do
            if curl -s http://localhost:10000/actuator/health/readiness | grep -q '"status":"UP"'; then
              echo "Backend is READY"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Backend failed to become ready within 10 minutes"
              cat backend.log
              exit 1
            fi
            sleep 5
          done

      - name: Seed E2E test user via REST API
        working-directory: ./portfolio-manager
        run: |
          echo "=== SEED USER START ==="
          for i in {1..30}; do
            echo "Attempt $i/30: Checking backend readiness..."
            READINESS=$(curl -s http://localhost:10000/actuator/health/readiness 2>/dev/null || echo "FAILED")
            echo "Readiness: $READINESS"
            if echo "$READINESS" | grep -q '"status":"UP"'; then
              echo "Backend READY"
              curl -s http://localhost:10000/actuator/health/readiness | jq .
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:10000/api/auth/register \
                -H "Content-Type: application/json" \
                -d '{"username":"analyst","email":"analyst@firma.com","password":"TestPass123!"}')
              echo "Register HTTP code: $HTTP_CODE"
              if echo "$HTTP_CODE" | grep -qE '^(200|201|409)$'; then
                echo "Test user seeded/already exists"
                break
              else
                echo "Register failed with code $HTTP_CODE, response:"
                curl -s -X POST http://localhost:10000/api/auth/register \
                  -H "Content-Type: application/json" \
                  -d '{"username":"analyst","email":"analyst@firma.com","password":"TestPass123!"}' | cat
              fi
            fi
            if [ $i -eq 30 ]; then
              echo "Failed to seed user after 60 seconds"
              echo "Backend log (last 50 lines):"
              tail -50 backend.log
              exit 1
            fi
            sleep 2
          done
          echo "=== SEED USER END ==="

      - name: Seed E2E test data (portfolio, deposit, positions)
        working-directory: ./portfolio-manager
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -e
          echo "=== SEED E2E TEST DATA START ==="
          echo "Attempting login..."
          LOGIN_RESPONSE=$(curl -s -X POST http://localhost:10000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"analyst@firma.com","password":"TestPass123!"}')
          echo "Login response: $LOGIN_RESPONSE"
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.token // .accessToken // empty')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to get auth token from login response"
            echo "Full response: $LOGIN_RESPONSE"
            exit 1
          fi
          echo "Got token: ${TOKEN:0:20}..."
          echo "Creating portfolio..."
          PORTFOLIO_RESPONSE=$(curl -s -X POST http://localhost:10000/api/portfolios \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name":"Test E2E Portfolio","description":"E2E Test Portfolio"}')
          echo "Portfolio create response: $PORTFOLIO_RESPONSE"
          PORTFOLIO_ID=$(echo "$PORTFOLIO_RESPONSE" | jq -r '.id // empty')
          PORTFOLIO_USER_ID=$(echo "$PORTFOLIO_RESPONSE" | jq -r '.userId // empty')
          if [ -z "$PORTFOLIO_ID" ] || [ "$PORTFOLIO_ID" = "null" ]; then
            echo "ERROR: Failed to create portfolio"
            exit 1
          fi
          echo "Portfolio ID: $PORTFOLIO_ID"
          echo "Portfolio userId: $PORTFOLIO_USER_ID"
          echo "Checking user cash balance BEFORE deposit..."
          USER_RESPONSE=$(curl -s -X GET "http://localhost:10000/api/users/me" \
            -H "Authorization: Bearer $TOKEN")
          echo "User before deposit: $USER_RESPONSE"
          USER_ID=$(echo "$USER_RESPONSE" | jq -r '.id // empty')
          echo "User ID from /me: $USER_ID"
          echo "Depositing cash..."
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5: POST deposit"
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/deposit.json -X POST \
              "http://localhost:10000/api/portfolios/$PORTFOLIO_ID/cash/deposit?amount=10000" \
              -H "Authorization: Bearer $TOKEN")
            DEPOSIT_RESPONSE=$(cat /tmp/deposit.json 2>/dev/null || echo "")
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $DEPOSIT_RESPONSE"
            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              ERROR_MSG=$(echo "$DEPOSIT_RESPONSE" | jq -r '.message // .error // empty' 2>/dev/null || echo "")
              if echo "$ERROR_MSG" | grep -qi "optimistic\|version\|Row was updated"; then
                echo "Optimistic lock conflict, retrying in 2s..."
                sleep 2
                continue
              fi
              echo "Deposit successful"
              break
            else
              ERROR_MSG=$(echo "$DEPOSIT_RESPONSE" | jq -r '.message // .error // empty' 2>/dev/null || echo "")
              if echo "$ERROR_MSG" | grep -qi "optimistic\|version\|Row was updated"; then
                echo "Optimistic lock conflict (HTTP $HTTP_CODE), retrying in 2s..."
                sleep 2
                continue
              fi
              echo "ERROR: HTTP $HTTP_CODE - $ERROR_MSG"
              exit 1
            fi
            if [ $attempt -eq 5 ]; then
              echo "ERROR: Failed after 5 attempts"
              exit 1
            fi
          done
          echo "Checking user cash balance AFTER deposit..."
          USER_RESPONSE=$(curl -s -X GET "http://localhost:10000/api/users/me" \
            -H "Authorization: Bearer $TOKEN")
          echo "User after deposit: $USER_RESPONSE"
          echo "Checking portfolio after deposit..."
          PORTFOLIO_RESPONSE=$(curl -s -X GET "http://localhost:10000/api/portfolios/$PORTFOLIO_ID" \
            -H "Authorization: Bearer $TOKEN")
          echo "Portfolio after deposit: $PORTFOLIO_RESPONSE"
          echo "Buying AAPL (10 shares @ $150 = $1500)..."
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5: POST buy"
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/buy.json -X POST \
              "http://localhost:10000/api/portfolios/$PORTFOLIO_ID/trade/buy?symbol=AAPL&quantity=10&price=150" \
              -H "Authorization: Bearer $TOKEN")
            BUY_RESPONSE=$(cat /tmp/buy.json 2>/dev/null || echo "")
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BUY_RESPONSE"
            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              ERROR_MSG=$(echo "$BUY_RESPONSE" | jq -r '.message // .error // empty' 2>/dev/null || echo "")
              if echo "$ERROR_MSG" | grep -qi "optimistic\|version\|Row was updated"; then
                echo "Optimistic lock conflict, retrying in 2s..."
                sleep 2
                continue
              fi
              echo "Buy successful"
              break
            else
              ERROR_MSG=$(echo "$BUY_RESPONSE" | jq -r '.message // .error // empty' 2>/dev/null || echo "")
              if echo "$ERROR_MSG" | grep -qi "optimistic\|version\|Row was updated"; then
                echo "Optimistic lock conflict (HTTP $HTTP_CODE), retrying in 2s..."
                sleep 2
                continue
              fi
              echo "ERROR: HTTP $HTTP_CODE - $ERROR_MSG"
              exit 1
            fi
            if [ $attempt -eq 5 ]; then
              echo "ERROR: Failed after 5 attempts"
              exit 1
            fi
          done
          echo "=== E2E TEST DATA SEEDED SUCCESSFULLY ==="

      - name: Start frontend dev server
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:10000
        run: |
          pnpm install --frozen-lockfile
          pnpm dev:3001 > frontend.log 2>&1 &
          echo $! > frontend.pid
          for i in {1..60}; do
            if curl -s http://localhost:3001/login | grep -q "Ingresar"; then
              echo "Frontend is ready"
              break
            fi
            sleep 3
          done

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm playwright test --reporter=line

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/

      - name: Kill backend
        if: always()
        run: |
          if [ -f portfolio-manager/backend.pid ]; then kill $(cat portfolio-manager/backend.pid) 2>/dev/null || true; fi
          docker stop data-collector-mock 2>/dev/null || true
          docker rm data-collector-mock 2>/dev/null || true

      - name: Kill frontend
        if: always()
        run: |
          if [ -f frontend/frontend.pid ]; then kill $(cat frontend/frontend.pid) 2>/dev/null || true; fi

  # ──────────────────────────────────────────────────────────────────
  # DOCKER BUILD - Multi-stage images
  # ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    needs: [backend-test, data-collector-test, frontend-unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for portfolio-manager
        id: meta-pm
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/portfolio-manager
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push portfolio-manager
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./portfolio-manager/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-pm.outputs.tags }}
          labels: ${{ steps.meta-pm.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for data-collector
        id: meta-dc
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/data-collector
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push data-collector
        uses: docker/build-push-action@v5
        with:
          context: ./data-collector
          file: ./data-collector/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dc.outputs.tags }}
          labels: ${{ steps.meta-dc.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  # ──────────────────────────────────────────────────────────────────
  # DEPLOY - VPS (on merge to main)
  # ──────────────────────────────────────────────────────────────────
  deploy-vps:
    name: Deploy to VPS (Docker Compose)
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/ubuntu/repositorios/CapitalFourge
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 30
            curl -f https://api.capitalfourge.com/actuator/health/readiness || exit 1
            echo "✅ Deployment successful"

  # ──────────────────────────────────────────────────────────────────
  # DEPLOY - Vercel (Frontend)
  # ──────────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy Frontend to Vercel
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # SECURITY SCANS
  # ──────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scans (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Java)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './portfolio-manager'
          format: 'sarif'
          output: 'trivy-java.sarif'

      - name: Run Trivy vulnerability scanner (Python)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './data-collector'
          format: 'sarif'
          output: 'trivy-python.sarif'

      - name: Run Trivy vulnerability scanner (Docker)
        uses: aquasecurity/trivy-action@master
        if: github.event_name != 'pull_request'
        with:
          scan-type: 'image'
          scan-ref: 'ghcr.io/${{ github.repository }}/portfolio-manager:latest'
          format: 'sarif'
          output: 'trivy-docker.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: '*.sarif'

  # ──────────────────────────────────────────────────────────────────
  # SUMMARY / GATE
  # ──────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs:
      - backend-test
      - data-collector-test
      - frontend-unit-test
      - frontend-build
      - frontend-e2e-test
      - docker-build
      - security-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend Tests: ${{ needs.backend-test.result }}"
          echo "Data Collector Tests: ${{ needs.data-collector-test.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Frontend E2E Tests: ${{ needs.frontend-e2e-test.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.data-collector-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-unit-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-e2e-test.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]] || \
             [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "❌ Some CI jobs failed"
            exit 1
          fi

          echo "✅ All CI checks passed!"