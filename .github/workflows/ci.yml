name: Capital Fourge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Database
  DB_HOST: localhost
  DB_PORT: 5433
  DB_NAME: finsight_db
  DB_USER: user
  # Redis
  SPRING_REDIS_URL: redis://localhost:6379
  # JWT
  JWT_ISSUER: capital-fourge
  JWT_ACCESS_EXPIRATION_MS: 86400000
  JWT_REFRESH_EXPIRATION_MS: 604800000
  # Data Collector
  DATA_COLLECTOR_BASE_URL: http://localhost:8000
  # Frontend
  NEXT_PUBLIC_API_BASE_URL: http://localhost:10000

jobs:
  # ──────────────────────────────────────────────────────────────────
  # BACKEND - Spring Boot (Maven)
  # ──────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Docker socket for Testcontainers - use container-based approach
    container:
      image: maven:3.9.6-eclipse-temurin-17
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      options: --user root

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U user -d finsight_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up fallback JWT_SECRET
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "JWT_SECRET not set in secrets, using test fallback"
            echo "JWT_SECRET=test-secret-key-for-unit-tests-only-32chars-minimum-length!!" >> $GITHUB_ENV
          fi

      - name: Build and test with Maven
        working-directory: ./portfolio-manager
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          mvn -B clean test \
            -Dspring.profiles.active=test \
            -DDB_HOST=${{ env.DB_HOST }} \
            -DDB_PORT=${{ env.DB_PORT }} \
            -DDB_NAME=${{ env.DB_NAME }} \
            -DDB_USER=${{ env.DB_USER }} \
            -DDB_PASSWORD=${{ env.DB_PASSWORD }} \
            -DSPRING_REDIS_URL=${{ env.SPRING_REDIS_URL }} \
            -DJWT_SECRET=${{ env.JWT_SECRET }} \
            -DJWT_ISSUER=${{ env.JWT_ISSUER }} \
            -DJWT_ACCESS_EXPIRATION_MS=${{ env.JWT_ACCESS_EXPIRATION_MS }} \
            -DJWT_REFRESH_EXPIRATION_MS=${{ env.JWT_REFRESH_EXPIRATION_MS }} \
            -DDATA_COLLECTOR_BASE_URL=${{ env.DATA_COLLECTOR_BASE_URL }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: portfolio-manager/target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────
  # FRONTEND UNIT TESTS - Vitest
  # ──────────────────────────────────────────────────────────────────
  frontend-unit-test:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: ./frontend
        run: pnpm vitest run --reporter=verbose

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ──────────────────────────────────────────────────────────────────
  # FRONTEND E2E TESTS - Playwright
  # ──────────────────────────────────────────────────────────────────
  frontend-e2e-test:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U user -d finsight_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:10000
        run: pnpm build

      - name: Start backend (Spring Boot)
        working-directory: ./portfolio-manager
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Ensure JWT_SECRET is at least 32 chars for CI
          if [ ${#JWT_SECRET} -lt 32 ]; then
            echo "JWT_SECRET too short, using test fallback"
            JWT_SECRET="test-secret-key-for-unit-tests-only-32chars!!"
          fi
          mvn spring-boot:run \
            -Dspring-boot.run.jvmArguments="-Xms64m -Xmx512m -XX:MaxRAMPercentage=80.0 -XX:+UseZGC -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m" \
            -DDB_HOST=localhost \
            -DDB_PORT=5433 \
            -DDB_NAME=finsight_db \
            -DDB_USER=user \
            -DDB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -DSPRING_REDIS_URL=redis://localhost:6379 \
            -DJWT_SECRET=${JWT_SECRET} \
            -DJWT_ISSUER=${{ env.JWT_ISSUER }} \
            -DJWT_ACCESS_EXPIRATION_MS=${{ env.JWT_ACCESS_EXPIRATION_MS }} \
            -DJWT_REFRESH_EXPIRATION_MS=${{ env.JWT_REFRESH_EXPIRATION_MS }} \
            -DDATA_COLLECTOR_BASE_URL=http://localhost:8000 \
            -Dserver.port=10000 \
            > backend.log 2>&1 &
          echo $! > backend.pid

      # Wait for backend to be ready - readiness probe (no Flyway, no data-collector health check in CI)
      - name: Wait for backend readiness
        working-directory: ./portfolio-manager
        run: |
          for i in {1..120}; do
            if curl -s http://localhost:10000/actuator/health/readiness | grep -q '"status":"UP"'; then
              echo "Backend is READY"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Backend failed to become ready within 10 minutes"
              cat backend.log
              exit 1
            fi
            sleep 5
          done

      - name: Seed E2E test user via REST API
        working-directory: ./portfolio-manager
        run: |
          # Wait for readiness probe then seed user
          for i in {1..30}; do
            if curl -s http://localhost:10000/actuator/health/readiness | grep -q '"status":"UP"'; then
              # Debug: show readiness details
              curl -s http://localhost:10000/actuator/health/readiness | jq .
              # Try to seed user with verbose output
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:10000/api/auth/register \
                -H "Content-Type: application/json" \
                -d '{"username":"analyst","email":"analyst@firma.com","password":"TestPass123!"}')
              echo "Register HTTP code: $HTTP_CODE"
              if echo "$HTTP_CODE" | grep -qE '^(200|201|409)$'; then
                echo "Test user seeded/already exists"
                break
              else
                echo "Register failed with code $HTTP_CODE, response:"
                curl -s -X POST http://localhost:10000/api/auth/register \
                  -H "Content-Type: application/json" \
                  -d '{"username":"analyst","email":"analyst@firma.com","password":"TestPass123!"}' | cat
              fi
            fi
            if [ $i -eq 30 ]; then
              echo "Failed to seed user after 60 seconds"
              exit 1
            fi
            sleep 2
          done

      - name: Seed E2E test data (portfolio, deposit, positions)
        working-directory: ./portfolio-manager
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -e  # Exit on any error
          # Login to get token
          LOGIN_RESPONSE=$(curl -s -X POST http://localhost:10000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"analyst@firma.com","password":"TestPass123!"}')
          echo "Login response: $LOGIN_RESPONSE"
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.token // empty')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to get auth token from login response"
            exit 1
          fi
          echo "Got token: ${TOKEN:0:20}..."
          
          # Create portfolio
          PORTFOLIO_RESPONSE=$(curl -s -X POST http://localhost:10000/api/portfolios \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name":"Test E2E Portfolio","description":"E2E Test Portfolio"}')
          echo "Portfolio create response: $PORTFOLIO_RESPONSE"
          PORTFOLIO_ID=$(echo "$PORTFOLIO_RESPONSE" | jq -r '.id // empty')
          if [ -z "$PORTFOLIO_ID" ] || [ "$PORTFOLIO_ID" = "null" ]; then
            echo "Failed to create portfolio"
            exit 1
          fi
          echo "Portfolio ID: $PORTFOLIO_ID"
          
          # Deposit cash (uses @RequestParam)
          DEPOSIT_RESPONSE=$(curl -s -X POST "http://localhost:10000/api/portfolios/$PORTFOLIO_ID/cash/deposit?amount=10000" \
            -H "Authorization: Bearer $TOKEN")
          echo "Deposit response: $DEPOSIT_RESPONSE"
          # Check for error
          DEPOSIT_ERROR=$(echo "$DEPOSIT_RESPONSE" | jq -r '.message // .error // empty')
          if [ -n "$DEPOSIT_ERROR" ] && [ "$DEPOSIT_ERROR" != "null" ]; then
            echo "Deposit failed: $DEPOSIT_ERROR"
            exit 1
          fi
          
          # Buy AAPL position (uses @RequestParam)
          BUY_RESPONSE=$(curl -s -X POST "http://localhost:10000/api/portfolios/$PORTFOLIO_ID/trade/buy?symbol=AAPL&quantity=10&price=150" \
            -H "Authorization: Bearer $TOKEN")
          echo "Buy AAPL response: $BUY_RESPONSE"
          BUY_ERROR=$(echo "$BUY_RESPONSE" | jq -r '.message // .error // empty')
          if [ -n "$BUY_ERROR" ] && [ "$BUY_ERROR" != "null" ]; then
            echo "Buy failed: $BUY_ERROR"
            exit 1
          fi
          
          echo "E2E test data seeded successfully"

      - name: Start frontend dev server
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:10000
        run: |
          pnpm dev:3001 > frontend.log 2>&1 &
          echo $! > frontend.pid
          # Wait for frontend to be ready
          for i in {1..60}; do
            if curl -s http://localhost:3001/login | grep -q "Ingresar"; then
              echo "Frontend is ready"
              break
            fi
            sleep 3
          done

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        run: pnpm playwright test --reporter=line

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/

      - name: Kill backend
        if: always()
        run: |
          if [ -f portfolio-manager/backend.pid ]; then kill $(cat portfolio-manager/backend.pid) 2>/dev/null || true; fi

      - name: Kill frontend
        if: always()
        run: |
          if [ -f frontend/frontend.pid ]; then kill $(cat frontend/frontend.pid) 2>/dev/null || true; fi

  # ──────────────────────────────────────────────────────────────────
  # FRONTEND BUILD CHECK
  # ──────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:10000
        run: pnpm build

  # ──────────────────────────────────────────────────────────────────
  # SUMMARY / GATE
  # ──────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs:
      - backend-test
      - frontend-unit-test
      - frontend-e2e-test
      - frontend-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend Tests: ${{ needs.backend-test.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-test.result }}"
          echo "Frontend E2E Tests: ${{ needs.frontend-e2e-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"

          if [[ "${{ needs.backend-test.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-unit-test.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-e2e-test.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "❌ Some CI jobs failed"
            exit 1
          fi

          echo "✅ All CI checks passed!"