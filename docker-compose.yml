version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # POSTGRESQL 15 + TimescaleDB + pgvector
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: cf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finsight_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c max_connections=200
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c work_mem=32MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d finsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ─────────────────────────────────────────────────────────────
  # REDIS 7
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cf-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1G

  # ─────────────────────────────────────────────────────────────
  # MONGODB 7 (for market movers cache)
  # ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: cf-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ─────────────────────────────────────────────────────────────
  # SPRING BOOT - Portfolio Manager
  # ─────────────────────────────────────────────────────────────
  portfolio-manager:
    build:
      context: ./portfolio-manager
      dockerfile: Dockerfile
    container_name: cf-portfolio-manager
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finsight_db
      DB_USER: user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      # Redis
      SPRING_REDIS_URL: redis://redis:6379
      SPRING_REDIS_SSL_ENABLED: "false"
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: capital-fourge
      JWT_ACCESS_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      # Data Collector
      DATA_COLLECTOR_BASE_URL: http://data-collector:8000
      DATA_COLLECTOR_API_KEY: ${DATA_COLLECTOR_API_KEY}
      SERVICE_API_KEY: ${DATA_COLLECTOR_API_KEY}
      # Render/Cloud detection
      RENDER: "false"
      # Java
      JAVA_OPTS: "-Xms2g -Xmx4g -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=32m -XX:+UseZGC -XX:MaxDirectMemorySize=512m -Dserver.address=0.0.0.0 -Dspring.datasource.hikari.maximum-pool-size=20 -Dspring.datasource.hikari.minimum-idle=5 -Dspring.redis.lettuce.pool.max-active=20 -Djdk.net.URLClassPath.disableClassPathURLCheck=true -XX:+ExitOnOutOfMemoryError"
    ports:
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G

  # ─────────────────────────────────────────────────────────────
  # DATA COLLECTOR - Python FastAPI
  # ─────────────────────────────────────────────────────────────
  data-collector:
    build:
      context: ./data-collector
      dockerfile: Dockerfile
    container_name: cf-data-collector
    restart: unless-stopped
    environment:
      # API Key for internal services
      SERVICE_API_KEY: ${DATA_COLLECTOR_API_KEY}
      # MongoDB (local container via docker network)
      DB_MONGO_HOST: mongodb://mongodb:27017
      DB_MONGO_ROOT_PASSWORD: ${DB_MONGO_ROOT_PASSWORD:-}
      # Redis
      SPRING_REDIS_URL: redis://redis:6379
      DB_REDIS_HOST: redis
      DB_REDIS_PASSWORD: ""
      # FMP API Key for market movers
      FMP_API_KEY: ${FMP_API_KEY:-}
      # Port
      PORT: "8000"
      RENDER: "false"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ─────────────────────────────────────────────────────────────
  # ORDER WORKER - Python (order fill + expiry)
  # ─────────────────────────────────────────────────────────────
  order-worker:
    build:
      context: ./order-worker
      dockerfile: Dockerfile
    container_name: cf-order-worker
    restart: unless-stopped
    environment:
      SERVICE_API_KEY: ${DATA_COLLECTOR_API_KEY}
      ORDER_WORKER_GRAPHQL_ENDPOINT: http://portfolio-manager:10000/graphql
      DATA_COLLECTOR_URL: http://data-collector:8000
      ORDER_FILL_INTERVAL_SECONDS: "30"
      ORDER_EXPIRY_INTERVAL_SECONDS: "60"
    depends_on:
      portfolio-manager:
        condition: service_healthy
      data-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ─────────────────────────────────────────────────────────────
  # CADDY - Reverse Proxy + Auto HTTPS
  # ─────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: cf-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portfolio-manager
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # PROMETHEUS - Metrics Collection
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cf-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ─────────────────────────────────────────────────────────────
  # GRAFANA - Visualization
  # ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.2
    container_name: cf-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.capitalfourge.com
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: capitalfourge-network