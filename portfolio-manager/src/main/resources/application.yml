spring:
  application:
    name: portfolio-manager

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finsight_db}?sslmode=disable&preferQueryMode=simple&prepareThreshold=0
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      data-source-properties:
        cachePrepStmts: false
        prepStmtCacheSize: 0
        prepStmtCacheSqlLimit: 0
        # Disable prepared statement caching at driver level
        prepareThreshold: 0
        useServerPrepStmts: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    url: ${SPRING_REDIS_URL:redis://localhost:6379}
    ssl:
      enabled: false
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
      shutdown-timeout: 100ms
    client-type: lettuce

  graphql:
    graphiql:
      enabled: false

  data-collector:
    api-key: ${DATA_COLLECTOR_API_KEY:internal-service-key}
    base-url: ${DATA_COLLECTOR_BASE_URL:http://localhost:8000}

  report:
    generator:
      script-path: ${REPORT_GENERATOR_SCRIPT_PATH:report-service/generator.py}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:capital-fourge}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# gRPC disabled - we use REST to data-collector now
grpc:
  server:
    enabled: false
    port: -1

server:
  port: ${PORT:10000}
  address: 0.0.0.0

# Health check on main server (same port as app)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: false
    caches:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true