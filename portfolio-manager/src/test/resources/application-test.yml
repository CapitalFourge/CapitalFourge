spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  # Disable Redis completely in tests
  redis:
    url: ""
    listener:
      enabled: false

# JWT config for tests
jwt:
  secret: ${JWT_SECRET:test-secret-key-for-unit-tests-only-32chars!!}
  issuer: "capital-fourge"
  access-expiration-ms: 3600000
  refresh-expiration-ms: 604800000

grpc:
  client:
    data-collector:
      api-key: "internal-service-key"

logging:
  level:
    root: INFO
    com.capitalfourge: DEBUG
