global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'capitalfourge-vps'
    environment: 'production'

scrape_configs:
  # Spring Boot Actuator Prometheus endpoint
  - job_name: 'portfolio-manager'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['portfolio-manager:10000']
        labels:
          service: 'portfolio-manager'

  # Data Collector (if it exposes /metrics)
  - job_name: 'data-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-collector:8000']
        labels:
          service: 'data-collector'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (if running on host)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'

  # Caddy (if it exposes metrics)
  - job_name: 'caddy'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['caddy:2019']
        labels:
          service: 'caddy'